<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Debug</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .debug { background: #f8f9fa; padding: 15px; margin: 15px 0; border-radius: 4px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Contact Form Debug Test</h1>
    
    <div class="debug">
        <h3>Debug Information:</h3>
        <p><strong>API URL:</strong> <span id="apiUrl">http://localhost:3000/api/contact/submit</span></p>
        <p><strong>Server Status:</strong> <span id="serverStatus">Checking...</span></p>
    </div>

    <form id="debugContactForm" class="contact-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="John Doe" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="john@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone (Optional)</label>
            <input type="tel" id="phone" name="phone" value="1234567890">
        </div>
        
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" value="Test Subject" required>
        </div>
        
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" required>This is a test message to debug the contact form.</textarea>
        </div>
        
        <button type="submit">Send Test Message</button>
    </form>
    
    <div id="debugLog" class="debug" style="display: none;">
        <h3>Debug Log:</h3>
        <pre id="logContent"></pre>
    </div>

    <script>
        // Check server status first
        async function checkServerStatus() {
            const statusElement = document.getElementById('serverStatus');
            try {
                const response = await fetch('http://localhost:3000/api/health');
                if (response.ok) {
                    const data = await response.json();
                    statusElement.textContent = '✅ Server is running';
                    statusElement.className = 'success';
                } else {
                    statusElement.textContent = `❌ Server error: ${response.status}`;
                    statusElement.className = 'error';
                }
            } catch (error) {
                statusElement.textContent = `❌ Cannot connect to server: ${error.message}`;
                statusElement.className = 'error';
            }
        }

        // Log function
        function log(message) {
            const logElement = document.getElementById('logContent');
            const debugDiv = document.getElementById('debugLog');
            debugDiv.style.display = 'block';
            logElement.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
        }

        // Contact form handler with detailed logging
        document.getElementById('debugContactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            log('Form submission started');
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.textContent;
            
            try {
                // Show loading state
                submitBtn.textContent = 'Sending...';
                submitBtn.disabled = true;
                
                // Get form data
                const formData = new FormData(e.target);
                const contactData = {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    phone: formData.get('phone') || '',
                    subject: formData.get('subject'),
                    message: formData.get('message'),
                    inquiryType: 'general'
                };
                
                log('Form data collected: ' + JSON.stringify(contactData));
                
                // Submit to API
                log('Sending request to API...');
                const response = await fetch('http://localhost:3000/api/contact/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(contactData)
                });
                
                log(`API Response Status: ${response.status}`);
                log(`API Response Headers: ${JSON.stringify(Array.from(response.headers.entries()))}`);
                
                const result = await response.json();
                log(`API Response Body: ${JSON.stringify(result)}`);
                
                if (response.ok) {
                    log('✅ SUCCESS: Message sent successfully!');
                    alert('✅ SUCCESS: Message sent successfully!');
                } else {
                    throw new Error(result.message || 'Failed to send message');
                }
                
            } catch (error) {
                log(`❌ ERROR: ${error.message}`);
                log(`Error details: ${JSON.stringify(error)}`);
                alert(`❌ ERROR: ${error.message}`);
            } finally {
                // Reset button state
                submitBtn.textContent = originalBtnText;
                submitBtn.disabled = false;
                log('Form submission completed');
            }
        });

        // Check server status on page load
        checkServerStatus();
    </script>
</body>
</html>
