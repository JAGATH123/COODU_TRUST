<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contact Form - Coodu Trust</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        textarea { height: 100px; resize: vertical; }
        button { background: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
        .message { padding: 15px; border-radius: 5px; margin: 15px 0; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>🧪 Test Contact Form - Coodu Trust</h1>
    <p>This is a test page for the contact form API. Fill out the form to test email functionality.</p>

    <form id="contactForm">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
            <label for="inquiryType">Inquiry Type</label>
            <select id="inquiryType" name="inquiryType">
                <option value="general">General Inquiry</option>
                <option value="volunteer">Volunteer</option>
                <option value="partnership">Partnership</option>
                <option value="donation">Donation</option>
                <option value="support">Support</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Subject *</label>
            <input type="text" id="subject" name="subject" required>
        </div>

        <div class="form-group">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const resultDiv = document.getElementById('result');
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            console.log('Sending contact form data:', data);

            try {
                resultDiv.innerHTML = '<div class="message">📤 Sending message...</div>';

                const response = await fetch('http://localhost:3000/api/contact/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log('Contact form response:', result);

                if (response.ok && result.status === 'success') {
                    resultDiv.innerHTML = `
                        <div class="message success">
                            <strong>✅ Success!</strong><br>
                            ${result.message}<br><br>
                            <strong>📧 Check your email for:</strong><br>
                            1. Confirmation email to: ${data.email}<br>
                            2. Notification email to: jagathguru2004@gmail.com
                        </div>
                    `;
                    e.target.reset(); // Clear form
                } else {
                    resultDiv.innerHTML = `
                        <div class="message error">
                            <strong>❌ Error:</strong><br>
                            ${result.message || 'Failed to send message'}
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Contact form error:', error);
                resultDiv.innerHTML = `
                    <div class="message error">
                        <strong>❌ Connection Error:</strong><br>
                        Make sure the backend server is running on port 3000
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
