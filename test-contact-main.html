<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Contact Form - Main Version</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .debug { background: #f8f9fa; padding: 15px; margin: 15px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Test Main Contact Form Structure</h1>
    
    <div class="debug">
        <p><strong>Testing the exact same structure as contact.html</strong></p>
        <p><strong>JavaScript Status:</strong> <span id="jsStatus">Loading...</span></p>
    </div>

    <!-- This is the EXACT same form structure as contact.html -->
    <form action="#" method="POST" class="contact-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="John Doe" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="john@example.com" required>
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" value="Test from main form" required>
        </div>
        <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="6" required>Testing main contact form structure</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
    
    <div id="testLog" class="debug"></div>

    <!-- Load the EXACT same main.js file -->
    <script src="assets/js/main.js"></script>
    
    <script>
        // Test if our contact form JavaScript is working
        document.getElementById('jsStatus').textContent = 'JavaScript loaded ✅';
        
        // Check if our contact form handler is attached
        setTimeout(() => {
            const form = document.querySelector('.contact-form');
            const hasEventListener = form && form.onclick !== null;
            
            document.getElementById('testLog').innerHTML = `
                <h3>Debug Results:</h3>
                <p><strong>Form found:</strong> ${form ? '✅ Yes' : '❌ No'}</p>
                <p><strong>Form class:</strong> ${form ? form.className : 'N/A'}</p>
                <p><strong>Submit handler attached:</strong> ${hasEventListener ? '✅ Yes' : '❌ Unknown'}</p>
                <p><strong>Main.js loaded:</strong> ✅ Yes</p>
            `;
        }, 100);
    </script>
</body>
</html>
