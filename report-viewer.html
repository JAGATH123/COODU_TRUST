<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annual Report Viewer | Coodu Trust</title>
  <meta name="description" content="Read Coodu Trust annual reports — interactive PDF reader with an impact summary, key highlights and statistics for each year.">
  <meta name="theme-color" content="#1e7e34">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/coodu-tokens.css?v=5">
  <link rel="stylesheet" href="assets/css/coodu-base.css?v=9">
  <link rel="stylesheet" href="assets/css/coodu-components.css?v=11">
  <link rel="stylesheet" href="assets/css/coodu-motion.css?v=6">
  <link rel="stylesheet" href="assets/css/coodu-report-viewer.css?v=1">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body data-page="report-viewer">

  <a class="skip-link" href="#rv-main">Skip to content</a>

  <!-- ============================================================ VIEWER BAR -->
  <header class="rv-bar">
    <div class="rv-bar__inner">
      <a class="rv-bar__back" href="documents.html">
        <i data-lucide="arrow-left" aria-hidden="true"></i>
        <span>All reports</span>
      </a>
      <div class="rv-bar__title">
        <span class="rv-bar__eyebrow">Annual report</span>
        <strong id="rv-bar-year">2023–2024</strong>
      </div>
      <div class="rv-bar__actions">
        <a class="rv-bar__btn" id="rv-download" href="#" download>
          <i data-lucide="download" aria-hidden="true"></i><span class="rv-bar__btn-label">Download</span>
        </a>
        <button class="rv-bar__btn" id="rv-print" type="button">
          <i data-lucide="printer" aria-hidden="true"></i><span class="rv-bar__btn-label">Print</span>
        </button>
        <button class="rv-bar__btn" id="rv-share" type="button">
          <i data-lucide="share-2" aria-hidden="true"></i><span class="rv-bar__btn-label">Share</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================================================ MAIN -->
  <main id="rv-main" class="rv">
    <div class="rv__grid">

      <!-- ===== PDF READER ===== -->
      <section class="rv__reader" aria-label="Report PDF">
        <div class="rv__toolbar">
          <div class="rv__pager">
            <button class="rv__icon-btn" id="rv-prev-page" aria-label="Previous page"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
            <span class="rv__pageinfo">Page <span id="rv-page">1</span> / <span id="rv-pages">–</span></span>
            <button class="rv__icon-btn" id="rv-next-page" aria-label="Next page"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
          </div>
          <div class="rv__zoom">
            <button class="rv__icon-btn" id="rv-zoom-out" aria-label="Zoom out"><i data-lucide="minus" aria-hidden="true"></i></button>
            <span id="rv-zoom">100%</span>
            <button class="rv__icon-btn" id="rv-zoom-in" aria-label="Zoom in"><i data-lucide="plus" aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="rv__canvas-wrap" id="rv-canvas-wrap">
          <div class="rv__loading" id="rv-loading">
            <span class="rv__spinner" aria-hidden="true"></span>
            <p>Loading report&hellip;</p>
          </div>
          <canvas id="rv-canvas" hidden></canvas>
          <div class="rv__error" id="rv-error" hidden>
            <i data-lucide="file-x" aria-hidden="true"></i>
            <p>This report couldn&rsquo;t be loaded in the reader.</p>
            <a class="btn btn--outline" id="rv-error-dl" href="#" target="_blank" rel="noopener">Open the PDF instead</a>
          </div>
        </div>
      </section>

      <!-- ===== SUMMARY ===== -->
      <aside class="rv__summary" aria-label="Report summary">
        <p class="eyebrow">Impact summary</p>
        <h1 class="rv__year" id="rv-year">2023–2024</h1>
        <p class="rv__subtitle" id="rv-subtitle">Scaling impact through collaboration &amp; innovation</p>

        <p class="rv__text" id="rv-summary"></p>

        <div class="rv__stats" id="rv-stats" aria-label="Key statistics"></div>

        <div class="rv__highlights">
          <h2 class="rv__h"><i data-lucide="sparkles" aria-hidden="true"></i> Key highlights</h2>
          <ul class="rv__hl-list" id="rv-highlights"></ul>
        </div>

        <nav class="rv__nav" aria-label="Browse reports">
          <a class="rv__nav-btn" id="rv-prev-report" href="#"><i data-lucide="arrow-left" aria-hidden="true"></i> <span></span></a>
          <a class="rv__nav-btn rv__nav-btn--next" id="rv-next-report" href="#"><span></span> <i data-lucide="arrow-right" aria-hidden="true"></i></a>
        </nav>
      </aside>

    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="assets/js/coodu-reports-data.js?v=2" defer></script>
  <script src="assets/js/coodu-report-viewer.js?v=1" defer></script>

</body>
</html>
